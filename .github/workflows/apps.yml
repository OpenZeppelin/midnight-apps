name: Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apps-${{ github.run_id }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Build apps
        id: build
        run: pnpm build:apps
        timeout-minutes: 10

      - name: Check for build artifacts
        run: |
          # Check if build artifacts exist
          if ! find apps/*/.next -type d 2>/dev/null | grep -q .; then
            echo "::error::❌ Build artifacts not found in apps/*/.next directories!"
            exit 1
          fi

          # List build artifacts
          echo "✅ Build artifacts found:"
          echo "Application build artifacts:"
          find apps -name ".next" -type d -exec ls -la {} \;

      - name: Run app tests
        run: pnpm test:apps
        timeout-minutes: 10

      - name: Check types for apps and packages
        run: pnpm types:apps && pnpm types:packages

      - name: Upload build artifacts
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apps-builds
          path: apps/*/.next/
          retention-days: 7

      - name: Upload test results
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apps-test-results
          path: |
            apps/*/coverage/
            apps/*/test-results/
          retention-days: 7

      - name: Cleanup on failure
        if: failure()
        run: |
          echo "Apps pipeline failed. Cleaning up..."
          rm -rf apps/*/.next/
